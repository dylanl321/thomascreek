<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Home Dollhouse</title>
<style>
html,body{margin:0;height:100%;background:#e6ded2;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#3a2a1e}
#tabs{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:6px;background:rgba(246,241,233,.92);padding:6px;border-radius:999px;box-shadow:0 8px 30px rgba(60,40,20,.18)}
button{border:0;border-radius:999px;padding:7px 14px;font-size:13px;background:transparent;color:#3a2a1e;cursor:pointer}
button.active{background:#3a2a1e;color:#fff}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:none}iframe.active{display:block}
</style></head><body>
<div id="tabs"><button data-k="den" class="active">Den</button><button data-k="kitchen">Kitchen · Dining · Laundry</button></div>
<iframe id="den" class="active" src="living-room/viewer.html"></iframe>
<iframe id="kitchen" data-src="kitchen/viewer.html"></iframe>
<script>
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('iframe').forEach(f => { const on = f.id === b.dataset.k; f.classList.toggle('active', on); if (on && !f.src) f.src = f.dataset.src; });
});
</script></body></html>
