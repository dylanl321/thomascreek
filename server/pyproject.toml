[project]
name = "thomascreek-hub"
version = "0.1.0"
description = "Thomas Creek Hub: the home-side service that holds every credential and enforces roles for the Thomas Creek app."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx[http2]>=0.27",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43",
  "pyyaml>=6",
  "websockets>=13",
  "zeroconf>=0.132",
  "onepassword-sdk>=0.4",
  "dbus-fast>=2.21",
  "python-multipart>=0.0.9",
  "segno>=1.6",
  "yt-dlp[default,deno]>=2026.10",
  "anthropic>=2.8",
  "aiomqtt>=2.3",
  "curl_cffi>=0.7",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff==0.17.5", "mypy==2.4.1"]

[project.scripts]
hub = "hub.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hub*"]

[tool.setuptools.package-data]
hub = ["routes/*.css"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

# Lint and type check. New findings fail tests/test_lint.py; old ones are counted in lint-baseline.json
# (see tools/lint.py). BLE001 is on so a new catch-all `except Exception` says why with a noqa comment.
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "ASYNC", "BLE"]
ignore = ["B008"]  # FastAPI's Depends(...) and Body(...) in defaults are intended

[tool.mypy]
python_version = "3.12"
files = ["hub"]
ignore_missing_imports = true
