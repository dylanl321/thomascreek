# Copy to <data dataset>/config.yaml on the NAS. Never commit the real file:
# this repository is public, and addresses belong only on the NAS.
# Secret values are NOT here. Each *_secret names a vault entry; store values
# with:  docker exec -it thomascreek-hub hub secrets set <name>

hub:
  name: Thomas Creek
  timezone: America/New_York
  listen_port: 8443
  # Practice mode: reads are real, writes are logged but not sent.
  # Turn actions on one at a time by listing them in live_actions.
  dry_run: true
  live_actions: []          # e.g. [light.set, scene.run, lights.control]
  home_networks: [192.168.1.0/24]
  trusted_proxies: []       # the reverse proxy's address, only if the hub is published through it
  remote_url: null          # e.g. https://hub.<your domain> if published

home_assistant:
  url: http://HOME_ASSISTANT:8123
  token_secret: home_assistant.token      # long-lived token of a dedicated "hub" HA user
  extra:
    tts_entity: tts.home_assistant_cloud
    shower_preheat_script: null
    remotes: {}                            # media_player.x -> remote.y when names differ

frigate:
  enabled: true
  url: http://FRIGATE:5000                # or :8971 with username + password_secret
  go2rtc_url: http://FRIGATE:1984
  username: null
  password_secret: frigate.password

plex:        {enabled: true,  url: http://PLEX:32400, token_secret: plex.token}
jellyseerr:  {enabled: true,  url: http://JELLYSEERR:5055, token_secret: jellyseerr.api_key}
sonarr:      {enabled: false, url: http://SONARR:8989, token_secret: sonarr.api_key}
radarr:      {enabled: false, url: http://RADARR:7878, token_secret: radarr.api_key}
truenas:     {enabled: true,  url: https://NAS, verify_tls: false, username: hub, token_secret: truenas.api_key}
mealie:      {enabled: true,  url: http://MEALIE:9000, token_secret: mealie.token}
homebox:     {enabled: true,  url: http://HOMEBOX:7745, username: hub@home, password_secret: homebox.password}
family_board:                 # Family Command Center
  enabled: true
  url: http://FAMILY_BOARD:8480
  # Not needed on the LAN (chores and redemptions are its "family actions").
  # Only if the hub reaches it through a proxy: store the parent PIN here.
  token_secret: family_board.admin_token
trek:                         # TREK trip planner (read-only API key)
  enabled: true
  url: http://TREK:3000
  web_url: https://TREK_SITE    # what "Plan in TREK" opens on a phone
  token_secret: trek.api_key    # TREK: Settings > Integrations > API key, "trips" allowed
  hidden_from_children: []      # trip ids kids and the tablet never see
show_player:
  enabled: true
  url: http://SHOW_PLAYER:8770
  token_secret: show_player.app_token
  token_header: Authorization   # show_player.py expects "Bearer <APP_TOKEN>"

firewalla:
  enabled: false
  msp_domain: YOURBOX.firewalla.net
  token_secret: firewalla.msp_token
  person_rules: {}   # person id -> [rule id] of a "block internet" rule per child

apns:
  enabled: false
  team_id: YOUR_TEAM_ID
  key_id: KEYID
  key_secret: apns.auth_key_p8           # contents of the AuthKey_XXXX.p8 file
  topic: me.dlewis.thomascreek

# Optional: copy credentials from 1Password into the vault on start and hourly.
# Needs a service account with read access to the vault below; store its token
# once with:  hub secrets set onepassword.service_account_token
# Items in that vault titled like a hub secret name (home_assistant.token,
# apns.auth_key_p8, ...) are copied; refs covers items that live elsewhere.
onepassword:
  enabled: false
  vault: Thomas Creek Hub
  refs: {}            # e.g. {plex.token: "op://Media/Plex/token"}
  refresh_s: 3600

vpn:
  provider: none     # pool: hand out Firewalla WireGuard clients; wg-cli: the hub's own server
  endpoint: PUBLIC_NAME_OR_IP:51820
  subnet: 10.77.0.0/24
  dns: [192.168.1.1]
  allowed_ips: [192.168.1.0/24]
  home_ssids: [HOME_WIFI_NAME]

child_policy:
  climate_min: 66
  climate_max: 74
  bedtime: "20:30"

guest:
  wifi_ssid: GUEST_WIFI
  wifi_password_secret: guest_wifi.password
  host_name: Dylan
  guidance:
    - {icon: car, title: Parking, detail: Left side of the driveway}

favorites: [kitchen, living_room]

modes:
  - id: good_night
    name: Good night
    symbol: moon.stars
    steps:
      - {action: scene.run, target: scene.good_night}
      - {action: lock.set, target: lock.front_door, params: {locked: true}}

assets:
  house-model: assets/house-model-web.json
  header: assets/header.jpg
