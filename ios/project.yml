# Generate the Xcode project with:  brew install xcodegen && cd ios && xcodegen
# The built-in VPN (WireGuard tunnel extension) is opt-in for now, because it needs Go to build:
#   brew install go && xcodegen --spec project-vpn.yml
name: ThomasCreek
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "18"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(TEAM_ID)
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  ThomasCreek:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        PRODUCT_NAME: ThomasCreek
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Thomas Creek
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroup: $(APP_GROUP)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIBackgroundModes: [remote-notification]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSFaceIDUsageDescription: Face ID confirms it's you before a door, lock, camera or oven changes.
        NSLocalNetworkUsageDescription: Finds the Thomas Creek hub on your home Wi-Fi.
        NSBonjourServices: [_thomascreek._tcp]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: thomascreek
            CFBundleURLSchemes: [thomascreek, christmaslights]
        # WireGuard .conf files from the Firewalla app or Files: "Open in Thomas Creek" adds them to the hub's VPN pool.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: WireGuard configuration
            LSHandlerRank: Alternate
            LSItemContentTypes: [me.dlewis.thomascreek.wgconf]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: me.dlewis.thomascreek.wgconf
            UTTypeDescription: WireGuard configuration
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [conf]
    entitlements:
      path: App/ThomasCreek.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [$(APP_GROUP)]
        com.apple.developer.usernotifications.time-sensitive: true
    dependencies:
      - target: HomeWidgets
      - target: NotificationService
  HomeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).widgets
        PRODUCT_NAME: HomeWidgets
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Thomas Creek
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    entitlements:
      path: Widgets/HomeWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - NotificationService
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).notifications
        PRODUCT_NAME: NotificationService
        SKIP_INSTALL: YES
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Thomas Creek
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
