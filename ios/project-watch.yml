# The App Store build plus the Apple Watch app (and the CarPlay scene once Apple grants the entitlement).
#   SPEC=project-watch.yml scripts/upload.sh
# Needs an App ID me.dlewis.thomascreek.watchkitapp and an App Store profile named
# "Thomas Creek watch App Store" (made through the App Store Connect API, like the others).
# XcodeGen appends lists, so this only adds the Watch target and the dependency.
include:
  - project-vpn-appstore.yml
options:
  deploymentTarget:
    watchOS: "11.0"
targets:
  ThomasCreek:
    dependencies:
      - target: ThomasCreekWatch
  ThomasCreekWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).watchkitapp
        PRODUCT_NAME: ThomasCreekWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: iPhone Distribution
          PROVISIONING_PROFILE_SPECIFIER: Thomas Creek watch App Store
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Thomas Creek
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_ID)
