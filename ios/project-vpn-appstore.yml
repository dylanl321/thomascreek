# The VPN build signed for the App Store without Xcode's account: Release uses manual signing with
# App Store profiles made through the App Store Connect API (see scripts/upload.sh, SPEC=project-vpn-appstore.yml).
# The profiles are named "Thomas Creek <app|widgets|tunnel> App Store" and must be installed on this Mac.
include:
  - project-vpn.yml
targets:
  ThomasCreek:
    settings:
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: iPhone Distribution
          PROVISIONING_PROFILE_SPECIFIER: Thomas Creek app App Store
  HomeWidgets:
    settings:
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: iPhone Distribution
          PROVISIONING_PROFILE_SPECIFIER: Thomas Creek widgets App Store
  ThomasCreekTunnel:
    settings:
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: iPhone Distribution
          PROVISIONING_PROFILE_SPECIFIER: Thomas Creek tunnel App Store
